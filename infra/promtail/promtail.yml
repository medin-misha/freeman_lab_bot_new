server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  # Сохраняет позиции чтения логов между перезапусками
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    # docker_sd_configs автоматически обнаруживает все запущенные контейнеры
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Имя контейнера (убираем ведущий /)
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      # Поток: stdout или stderr
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream
      # Имя сервиса в docker compose
      - source_labels: ['__meta_docker_compose_service']
        target_label: service
      # Имя compose-проекта
      - source_labels: ['__meta_docker_compose_project']
        target_label: project

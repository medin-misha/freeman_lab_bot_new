[project]
name = "freeman-lab-frontend-bot"
version = "0.1.0"
description = "User-facing Telegram bot for the Freeman Lab monorepo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aio-pika>=9.5.8",
    "aiohttp>=3.12.15",
    "aiogram>=3.27.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
